<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Sora:wght@400;600;700&display=swap');

        :root {
            --bg: #020205;
            /* Deep black-purple */
            --panel: rgba(13, 10, 20, 0.92);
            /* Dark purple panel */
            --panel-border: rgba(147, 51, 234, 0.3);
            /* Purple border */
            --text: #f3e8ff;
            /* Lavender white */
            --muted: rgba(243, 232, 255, 0.6);
            --neon-purple: #a855f7;
            /* Primary purple */
            --neon-magenta: #d946ef;
            /* Secondary magenta */
            --neon-cyan: #a855f7;
            /* Remapped for compatibility */
            --neon-lime: #d946ef;
            /* Remapped for compatibility */
            --neon-pink: #ff00ff;
            /* Keep for specific accents */
            --shadow-neon: 0 0 24px rgba(168, 85, 247, 0.25);
            --deep-space: #020205;
            --nebula-purple: rgba(88, 28, 135, 0.4);
            --nebula-blue: rgba(49, 46, 129, 0.3);
            --scroll-track: rgba(255, 255, 255, 0.05);
            --scroll-thumb-start: rgba(168, 85, 247, 0.7);
            --scroll-thumb-end: rgba(217, 70, 239, 0.7);
            --scroll-thumb-border: rgba(255, 255, 255, 0.2);
            --scroll-thumb-glow: 0 0 14px rgba(168, 85, 247, 0.3);
            --scroll-size-v: 8px;
            --scroll-size-h: 8px;
            --scroll-radius: 999px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', system-ui, sans-serif;
            background-color: var(--deep-space);
            background-image:
                radial-gradient(circle at 50% 50%, #1a1d2e 0%, #050607 100%);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            position: relative;
        }

        /* Stars */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(1px 1px at 10% 10%, #fff 100%, transparent),
                radial-gradient(1px 1px at 20% 20%, #fff 100%, transparent),
                radial-gradient(1px 1px at 30% 30%, #fff 100%, transparent),
                radial-gradient(1px 1px at 40% 40%, #fff 100%, transparent),
                radial-gradient(1px 1px at 50% 50%, #fff 100%, transparent),
                radial-gradient(1px 1px at 60% 60%, #fff 100%, transparent),
                radial-gradient(1px 1px at 70% 70%, #fff 100%, transparent),
                radial-gradient(1px 1px at 80% 80%, #fff 100%, transparent),
                radial-gradient(1px 1px at 90% 90%, #fff 100%, transparent),
                radial-gradient(2px 2px at 15% 85%, #fff 100%, transparent),
                radial-gradient(2px 2px at 85% 15%, #fff 100%, transparent);
            background-size: 550px 550px;
            opacity: 0.6;
            z-index: 0;
            animation: starsMove 120s linear infinite;
        }

        /* Nebula Clouds */
        body::after {
            content: '';
            position: fixed;
            inset: -50%;
            width: 200%;
            height: 200%;
            background:
                radial-gradient(circle at 30% 30%, var(--nebula-purple), transparent 40%),
                radial-gradient(circle at 70% 70%, var(--nebula-blue), transparent 40%),
                radial-gradient(circle at 80% 20%, rgba(53, 240, 255, 0.1), transparent 30%);
            filter: blur(60px);
            opacity: 0.7;
            z-index: 0;
            animation: nebulaPulse 20s ease-in-out infinite alternate;
            mix-blend-mode: screen;
            pointer-events: none;
        }

        @keyframes starsMove {
            from {
                background-position: 0 0;
            }

            to {
                background-position: 1000px 1000px;
            }
        }

        @keyframes nebulaPulse {
            0% {
                transform: scale(1) translate(0, 0);
                opacity: 0.6;
            }

            50% {
                transform: scale(1.1) translate(-2%, -2%);
                opacity: 0.8;
            }

            100% {
                transform: scale(1) translate(0, 0);
                opacity: 0.6;
            }
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 40px 30px;
            position: relative;
            z-index: 1;
        }

        /* Projects View */
        #projects-view {
            display: flex;
            flex-direction: column;
            height: 100%;
            animation: fadeIn 0.4s ease;
        }

        #projects-view.hidden {
            display: none;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes scaleIn {
            from {
                transform: scale(0.95);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-5px);
            }
        }

        .header {
            margin-bottom: 40px;
            animation: slideUp 0.5s ease;
        }

        .header h1 {
            font-family: 'Sora', system-ui, sans-serif;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.8px;
            text-transform: uppercase;
            background: linear-gradient(135deg, var(--text) 0%, var(--neon-purple) 60%, var(--neon-magenta) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .projects-list {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 20px;
            padding-right: 5px;
        }

        .projects-list,
        .tasks-list,
        .task-actions-scroll {
            scrollbar-width: thin;
            scrollbar-color: rgba(53, 240, 255, 0.74) var(--scroll-track);
        }

        .projects-list::-webkit-scrollbar,
        .tasks-list::-webkit-scrollbar,
        .task-actions-scroll::-webkit-scrollbar {
            width: var(--scroll-size-v);
            height: var(--scroll-size-h);
        }

        .projects-list::-webkit-scrollbar-track,
        .tasks-list::-webkit-scrollbar-track,
        .task-actions-scroll::-webkit-scrollbar-track {
            background: var(--scroll-track);
            border-radius: var(--scroll-radius);
        }

        .projects-list::-webkit-scrollbar-thumb,
        .tasks-list::-webkit-scrollbar-thumb,
        .task-actions-scroll::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, var(--scroll-thumb-start), var(--scroll-thumb-end));
            border: 1px solid var(--scroll-thumb-border);
            border-radius: var(--scroll-radius);
            box-shadow: var(--scroll-thumb-glow), inset 0 0 0 1px rgba(255, 255, 255, 0.14);
        }

        .projects-list::-webkit-scrollbar-corner,
        .tasks-list::-webkit-scrollbar-corner,
        .task-actions-scroll::-webkit-scrollbar-corner {
            background: transparent;
        }

        @media (hover: hover) and (pointer: fine) {

            .projects-list::-webkit-scrollbar-thumb:hover,
            .tasks-list::-webkit-scrollbar-thumb:hover,
            .task-actions-scroll::-webkit-scrollbar-thumb:hover {
                background: linear-gradient(135deg, rgba(53, 240, 255, 0.9), rgba(182, 255, 59, 0.78));
                box-shadow: 0 0 16px rgba(53, 240, 255, 0.42), inset 0 0 0 1px rgba(255, 255, 255, 0.22);
            }
        }

        .project-item {
            background: var(--panel);
            border: 1px solid var(--panel-border);
            padding: 24px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 16px;
            position: relative;
            overflow: hidden;
            animation: slideUp 0.5s ease backwards;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
        }

        .project-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.5) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .project-item::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 16px;
            padding: 2px;
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.6), rgba(217, 70, 239, 0.6));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        @media (hover: hover) and (pointer: fine) {
            .project-item:hover {
                background: rgba(13, 10, 20, 0.98);
                border-color: rgba(168, 85, 247, 0.6);
                transform: translateY(-2px);
                box-shadow: 0 12px 40px rgba(168, 85, 247, 0.2), 0 0 60px rgba(217, 70, 239, 0.1);
            }

            .project-item:hover::before {
                opacity: 1;
            }

            .project-item:hover::after {
                opacity: 1;
            }
        }

        .project-item:active {
            transform: translateY(0px) scale(0.98);
        }

        .project-item:nth-child(1) {
            animation-delay: 0.1s;
        }

        .project-item:nth-child(2) {
            animation-delay: 0.2s;
        }

        .project-item:nth-child(3) {
            animation-delay: 0.3s;
        }

        .project-item:nth-child(4) {
            animation-delay: 0.4s;
        }

        .project-item:nth-child(5) {
            animation-delay: 0.5s;
        }

        .project-content {
            flex: 1;
        }

        .project-title {
            font-size: 17px;
            font-weight: 600;
            color: var(--text);
            letter-spacing: -0.1px;
            text-transform: uppercase;
        }

        .project-actions {
            display: flex;
            gap: 8px;
            opacity: 1;
            transition: opacity 0.3s ease;
            position: relative;
            z-index: 10;
            pointer-events: auto;
        }

        @media (hover: hover) and (pointer: fine) {
            .project-actions {
                opacity: 0;
            }

            .project-item:hover .project-actions {
                opacity: 1;
            }
        }

        .project-action-btn {
            background: rgba(168, 85, 247, 0.1);
            border: 1px solid rgba(168, 85, 247, 0.3);
            color: var(--text);
            min-width: 44px;
            min-height: 44px;
            width: 44px;
            height: 44px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            font-size: 18px;
            position: relative;
            z-index: 100;
            pointer-events: auto;
            -webkit-tap-highlight-color: transparent;
        }

        .project-action-btn::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 8px;
            padding: 2px;
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.5), rgba(217, 70, 239, 0.3));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        @media (hover: hover) and (pointer: fine) {
            .project-action-btn:hover::before {
                opacity: 1;
            }

            .task-checkbox:hover {
                border-color: rgba(168, 85, 247, 0.7);
                transform: scale(1.1);
                box-shadow: 0 0 15px rgba(168, 85, 247, 0.5);
            }

            .project-action-btn:hover {
                background: rgba(168, 85, 247, 0.25);
                transform: scale(1.05);
                box-shadow: var(--shadow-neon);
            }
        }

        .project-action-btn:active {
            transform: scale(0.95);
        }

        .project-action-btn.delete:hover {
            background: rgba(255, 59, 48, 0.2);
            border-color: rgba(255, 59, 48, 0.4);
            box-shadow: 0 0 20px rgba(255, 59, 48, 0.5);
        }

        .project-action-btn.delete:hover::before {
            background: linear-gradient(135deg, rgba(255, 59, 48, 0.5), rgba(255, 59, 48, 0.2));
        }

        .project-action-btn.edit:hover {
            box-shadow: 0 0 20px rgba(53, 240, 255, 0.45);
        }

        .add-project-btn {
            width: 100%;
            padding: 18px;
            border: 1px solid rgba(217, 70, 239, 0.45);
            background: rgba(13, 10, 20, 0.9);
            color: var(--text);
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 16px;
            font-weight: 600;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
            -webkit-tap-highlight-color: transparent;
        }

        .add-project-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .add-project-btn::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 16px;
            padding: 2px;
            background: linear-gradient(135deg, rgba(217, 70, 239, 0.7), rgba(168, 85, 247, 0.6));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        @media (hover: hover) and (pointer: fine) {
            .add-project-btn:hover::before {
                width: 300px;
                height: 300px;
            }

            .add-project-btn:hover::after {
                opacity: 1;
            }

            .add-project-btn:hover {
                background: rgba(13, 10, 20, 0.95);
                border-color: rgba(217, 70, 239, 0.7);
                transform: translateY(-2px);
                box-shadow: 0 10px 30px rgba(217, 70, 239, 0.25), 0 0 60px rgba(168, 85, 247, 0.2);
            }
        }

        .add-project-btn:active {
            transform: scale(0.98);
        }

        .add-project-btn span {
            position: relative;
            z-index: 1;
        }

        /* Tasks View */
        #tasks-view {
            display: none;
            flex-direction: column;
            height: 100%;
        }

        #tasks-view.active {
            display: flex;
            animation: fadeIn 0.4s ease;
        }

        .back-btn {
            background: var(--panel);
            border: 1px solid var(--panel-border);
            font-size: 16px;
            cursor: pointer;
            padding: 12px 20px;
            margin-bottom: 20px;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border-radius: 12px;
            color: var(--text);
            transition: all 0.3s ease;
            -webkit-tap-highlight-color: transparent;
            font-weight: 600;
            width: fit-content;
        }

        @media (hover: hover) and (pointer: fine) {
            .back-btn:hover {
                background: rgba(13, 10, 20, 0.95);
                border-color: rgba(168, 85, 247, 0.45);
                transform: translateX(-3px);
            }
        }

        .back-btn:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.15);
        }

        .project-header {
            margin-bottom: 30px;
        }

        .project-name {
            font-size: 28px;
            font-weight: 700;
            border: none;
            outline: none;
            width: 100%;
            padding: 8px 0;
            background: transparent;
            color: var(--text);
            letter-spacing: -0.4px;
            text-transform: uppercase;
            font-family: 'Sora', system-ui, sans-serif;
        }

        .task-checkbox.checked::after {
            content: '\2713';
            color: #0a0c0e;
            font-size: 16px;
            font-weight: bold;
            font-family: 'Sora', system-ui, sans-serif;
        }

        .project-name::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .tasks-list {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 20px;
            padding-right: 5px;
        }

        .task-item {
            display: flex;
            align-items: center;
            padding: 18px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            transition: transform 160ms ease, padding-left 0.2s ease, opacity 0.2s ease;
            animation: slideUp 0.3s ease backwards;
            position: relative;
            touch-action: pan-y;
        }

        .task-item.swiping {
            transition: none;
        }

        .tasks-list.dragging {
            cursor: grabbing;
        }

        .tasks-list.dragging .task-item:hover {
            padding-left: 0;
        }

        .task-item.dragging {
            z-index: 5;
            opacity: 0.7;
            transform: scale(1.02);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
            background: rgba(13, 10, 20, 0.95);
            transition: none;
            pointer-events: none;
            border-bottom-color: rgba(168, 85, 247, 0.35);
        }

        .task-item.drag-placeholder {
            border: 1px dashed rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            margin: 6px 0;
            transition: height 120ms ease, margin 120ms ease;
        }

        .task-item.swipe-left {
            background: linear-gradient(90deg, transparent, rgba(255, 59, 48, 0.2));
        }

        .task-item.swipe-right {
            background: linear-gradient(90deg, rgba(52, 199, 89, 0.2), transparent);
        }

        .task-item:hover {
            padding-left: 8px;
        }

        .swipe-indicator {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 24px;
            opacity: 0;
            transition: opacity 0.2s ease;
            pointer-events: none;
        }

        .swipe-indicator.left {
            right: 20px;
        }

        .swipe-indicator.right {
            left: 20px;
        }

        .task-item.swipe-left .swipe-indicator.left {
            opacity: 1;
        }

        .task-item.swipe-right .swipe-indicator.right {
            opacity: 1;
        }

        .task-checkbox {
            min-width: 28px;
            min-height: 28px;
            width: 28px;
            height: 28px;
            border: 2px solid rgba(168, 85, 247, 0.35);
            margin-right: 15px;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            -webkit-tap-highlight-color: transparent;
        }

        .task-checkbox::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 8px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.5) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        @media (hover: hover) and (pointer: fine) {
            .task-checkbox:hover {
                border-color: rgba(168, 85, 247, 0.7);
                transform: scale(1.1);
                box-shadow: 0 0 15px rgba(168, 85, 247, 0.5);
            }

            .task-checkbox:hover::before {
                opacity: 1;
            }
        }

        .task-checkbox:active {
            transform: scale(0.95);
        }

        .task-text {
            flex: 1;
            border: none;
            outline: none;
            font-size: 16px;
            background: transparent;
            font-family: inherit;
            color: var(--text);
            transition: all 0.3s ease;
        }

        .task-text::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .task-text.completed {
            text-decoration: line-through;
            opacity: 0.4;
        }

        .delete-task-btn {
            background: rgba(255, 59, 48, 0.12);
            border: 1px solid rgba(255, 59, 48, 0.35);
            color: rgba(255, 59, 48, 0.9);
            min-width: 40px;
            min-height: 40px;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            font-size: 20px;
            cursor: pointer;
            opacity: 1;
            transition: all 0.3s ease;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }

        @media (hover: hover) and (pointer: fine) {
            .delete-task-btn {
                opacity: 0;
            }

            .task-item:hover .delete-task-btn {
                opacity: 1;
            }
        }

        .delete-task-btn:hover {
            background: rgba(255, 59, 48, 0.2);
            border-color: rgba(255, 59, 48, 0.4);
            transform: scale(1.05);
        }

        .delete-task-btn:active {
            transform: scale(0.95);
        }

        .add-task-container {
            display: flex;
            gap: 10px;
        }

        .task-actions-scroll {
            display: flex;
            flex-wrap: nowrap;
            gap: 10px;
            margin-bottom: 15px;
            max-width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-x: contain;
            padding-bottom: 8px;
        }

        .clear-all-btn {
            padding: 12px 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(13, 10, 20, 0.85);
            color: var(--muted);
            cursor: pointer;
            font-size: 14px;
            border-radius: 12px;
            transition: all 0.3s ease;
            font-weight: 600;
            white-space: nowrap;
            flex: 0 0 auto;
            -webkit-tap-highlight-color: transparent;
        }

        @media (hover: hover) and (pointer: fine) {
            .clear-all-btn:hover {
                background: rgba(13, 10, 20, 0.95);
                border-color: rgba(217, 70, 239, 0.5);
                color: var(--text);
            }
        }

        .clear-all-btn:active {
            transform: scale(0.98);
        }

        .add-task-input {
            flex: 1;
            padding: 16px;
            border: 1px solid rgba(168, 85, 247, 0.35);
            outline: none;
            font-size: 16px;
            border-radius: 12px;
            font-family: inherit;
            background: rgba(13, 10, 20, 0.85);

            color: var(--text);
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .add-task-input:focus {
            border-color: rgba(168, 85, 247, 0.7);
            background: rgba(13, 10, 20, 0.95);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.3), inset 0 0 20px rgba(168, 85, 247, 0.12);
        }

        .add-task-input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .add-task-submit {
            padding: 16px 24px;
            border: 1px solid rgba(168, 85, 247, 0.45);
            background: rgba(168, 85, 247, 0.14);
            color: var(--text);
            cursor: pointer;
            font-size: 16px;
            border-radius: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 600;
        }

        @media (hover: hover) and (pointer: fine) {
            .add-task-submit:hover {
                transform: translateY(-2px);
                box-shadow: 0 8px 24px rgba(168, 85, 247, 0.25), 0 0 40px rgba(217, 70, 239, 0.18);
            }
        }

        .add-task-submit:active {
            transform: translateY(0) scale(0.98);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .modal.active {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        .modal-content {
            background-color: rgba(13, 10, 20, 0.95);
            padding: 32px;
            border: 1px solid rgba(168, 85, 247, 0.3);
            max-width: 400px;
            width: 90%;
            border-radius: 20px;
            animation: scaleIn 0.3s ease;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 30px rgba(168, 85, 247, 0.1);
        }

        .task-checkbox.checked {
            background-color: var(--neon-pink);
            border-color: var(--neon-pink);
            animation: scaleIn 0.3s ease;
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.6);
        }

        .modal-content h2 {
            font-size: 22px;
            font-weight: 400;
            margin-bottom: 20px;
            color: #ffffff;
        }

        .modal-input {
            width: 100%;
            padding: 14px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            outline: none;
            font-size: 16px;
            margin-bottom: 24px;
            border-radius: 12px;
            font-family: inherit;
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            transition: all 0.3s ease;
        }

        .modal-input:focus {
            border-color: rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.08);
        }

        .modal-input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .modal-btn {
            padding: 12px 24px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            font-size: 15px;
            border-radius: 10px;
            font-family: inherit;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .modal-btn.cancel {
            background-color: rgba(255, 255, 255, 0.05);
            color: #ffffff;
        }

        .modal-btn.cancel:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .modal-btn.confirm {
            background-color: #ffffff;
            color: #000000;
        }

        @media (hover: hover) and (pointer: fine) {
            .modal-btn.confirm:hover {
                transform: translateY(-2px);
                box-shadow: 0 4px 12px rgba(255, 255, 255, 0.3);
            }
        }

        .modal-btn:active {
            transform: scale(0.98);
        }

        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(30, 30, 30, 0.95);
            color: #ffffff;
            padding: 16px 24px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            gap: 16px;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 2000;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.1);
            max-width: 90%;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast-message {
            flex: 1;
            font-size: 15px;
        }

        .toast-action {
            background: rgba(100, 200, 255, 0.2);
            border: 1px solid rgba(100, 200, 255, 0.4);
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .toast-action:hover {
            background: rgba(100, 200, 255, 0.3);
            box-shadow: 0 0 20px rgba(100, 200, 255, 0.4);
        }

        .toast-action:active {
            transform: scale(0.95);
        }

        /* Mobile optimizations */
        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }

            :root {
                --texture-fiber-opacity: 0.14;
                --texture-fiber-scale: 1.75px;
                --scroll-size-v: 7px;
                --scroll-size-h: 7px;
            }

            .header h1 {
                font-size: 28px;
            }

            .project-item {
                padding: 20px;
            }

            .add-project-btn {
                padding: 16px;
            }

            .project-name {
                font-size: 24px;
            }

            .task-actions-scroll {
                gap: 8px;
                overflow-x: auto;
                overflow-y: hidden;
                white-space: nowrap;
            }

            .clear-all-btn {
                padding: 11px 16px;
            }

            .toast {
                bottom: 20px;
                max-width: calc(100% - 40px);
            }
        }

        /* Swipe gestures */
        .task-item {
            position: relative;
            user-select: none;
        }

        .task-item.swiping {
            transition: none !important;
        }

        .task-item.swipe-left {
            background: linear-gradient(90deg, transparent, rgba(255, 59, 48, 0.2));
        }

        .task-item.swipe-right {
            background: linear-gradient(90deg, rgba(52, 199, 89, 0.2), transparent);
        }

        .swipe-indicator {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 22px;
            opacity: 0;
            transition: opacity 0.2s ease;
            pointer-events: none;
            z-index: 1;
        }

        .swipe-indicator.left {
            left: 20px;
            color: rgba(52, 199, 89, 0.8);
        }

        .swipe-indicator.right {
            right: 20px;
            color: rgba(255, 59, 48, 0.8);
        }

        .task-item.swipe-left .swipe-indicator.right {
            opacity: 1;
        }

        .task-item.swipe-right .swipe-indicator.left {
            opacity: 1;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Projects View (Right picture in sketch) -->
        <div id="projects-view">
            <div class="header">
                <h1>Tasks</h1>
            </div>
            <div class="projects-list" id="projects-list"></div>
            <button class="add-project-btn" id="add-project-btn"><span>Add Tasks</span></button>
        </div>

        <!-- Tasks View (Left picture in sketch) -->
        <div id="tasks-view">
            <button class="back-btn" id="back-btn">
                <span>←</span>
                <span>Back</span>
            </button>
            <div class="project-header">
                <input type="text" class="project-name" id="project-name" placeholder="Project Name">
            </div>
            <div class="task-actions-scroll">
                <button class="clear-all-btn" id="clear-all-btn">Clear</button>
                <button class="clear-all-btn" id="copy-all-btn">Copy All</button>
                <button class="clear-all-btn" id="paste-all-btn">Paste</button>
                <button class="clear-all-btn" id="delete-all-btn"
                    style="border-color: rgba(255, 59, 48, 0.45); color: rgba(255, 59, 48, 0.9);">Delete All</button>
            </div>
            <div class="tasks-list" id="tasks-list"></div>
            <div class="add-task-container">
                <input type="text" class="add-task-input" id="add-task-input" placeholder="Add task name"
                    enterkeyhint="done" autocomplete="off">
                <button class="add-task-submit" id="add-task-submit">Add</button>
            </div>
        </div>
    </div>

    <!-- Modal for new project -->
    <div class="modal" id="project-modal">
        <div class="modal-content">
            <h2>New Project</h2>
            <input type="text" class="modal-input" id="project-modal-input" placeholder="Enter project name"
                enterkeyhint="done" autocomplete="off">
            <div class="modal-buttons">
                <button class="modal-btn cancel" id="modal-cancel">Cancel</button>
                <button class="modal-btn confirm" id="modal-confirm">Create</button>
            </div>
        </div>
    </div>

    <!-- Modal for delete confirmation -->
    <div class="modal" id="delete-modal">
        <div class="modal-content">
            <h2>Delete Project</h2>
            <p id="delete-modal-message"
                style="margin-bottom: 24px; color: rgba(255, 255, 255, 0.7); line-height: 1.5;">Are you sure you want to
                delete this project?</p>
            <div class="modal-buttons">
                <button class="modal-btn cancel" id="delete-modal-cancel">Cancel</button>
                <button class="modal-btn confirm" id="delete-modal-confirm"
                    style="background: rgba(255, 59, 48, 0.8); border-color: rgba(255, 59, 48, 0.4);">Delete</button>
            </div>
        </div>
    </div>

    <!-- Modal for delete all tasks confirmation -->
    <div class="modal" id="delete-all-modal">
        <div class="modal-content">
            <h2>Delete All Tasks</h2>
            <p id="delete-all-modal-message"
                style="margin-bottom: 24px; color: rgba(255, 255, 255, 0.7); line-height: 1.5;">Are you sure you want to
                delete all tasks?</p>
            <div class="modal-buttons">
                <button class="modal-btn cancel" id="delete-all-modal-cancel">Cancel</button>
                <button class="modal-btn confirm" id="delete-all-modal-confirm"
                    style="background: rgba(255, 59, 48, 0.8); border-color: rgba(255, 59, 48, 0.4);">Delete</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">
        <div class="toast-message" id="toast-message"></div>
        <button class="toast-action" id="toast-action">Undo</button>
    </div>

    <script>
        // Data structure
        let projects = JSON.parse(localStorage.getItem('projects')) || [];
        let currentProjectId = null;
        let editingProjectId = null;
        let deletingProjectId = null;
        let deletedProject = null;
        let toastTimeout = null;
        let dragState = {
            active: false,
            pending: false,
            startIndex: null,
            currentIndex: null,
            longPressTimer: null,
            dragEl: null,
            placeholder: null,
            startY: 0,
            pointerId: null,
            lastX: 0,
            lastY: 0,
            rafId: null
        };

        // DOM elements
        const projectsView = document.getElementById('projects-view');
        const tasksView = document.getElementById('tasks-view');
        const projectsList = document.getElementById('projects-list');
        const addProjectBtn = document.getElementById('add-project-btn');
        const backBtn = document.getElementById('back-btn');
        const projectNameInput = document.getElementById('project-name');
        const tasksList = document.getElementById('tasks-list');
        const clearAllBtn = document.getElementById('clear-all-btn');
        const copyAllBtn = document.getElementById('copy-all-btn');
        const pasteAllBtn = document.getElementById('paste-all-btn');
        const deleteAllBtn = document.getElementById('delete-all-btn');
        const addTaskInput = document.getElementById('add-task-input');
        const addTaskSubmit = document.getElementById('add-task-submit');
        const projectModal = document.getElementById('project-modal');
        const projectModalInput = document.getElementById('project-modal-input');
        const modalCancel = document.getElementById('modal-cancel');
        const modalConfirm = document.getElementById('modal-confirm');
        const deleteModal = document.getElementById('delete-modal');
        const deleteModalMessage = document.getElementById('delete-modal-message');
        const deleteModalCancel = document.getElementById('delete-modal-cancel');
        const deleteModalConfirm = document.getElementById('delete-modal-confirm');
        const deleteAllModal = document.getElementById('delete-all-modal');
        const deleteAllModalMessage = document.getElementById('delete-all-modal-message');
        const deleteAllModalCancel = document.getElementById('delete-all-modal-cancel');
        const deleteAllModalConfirm = document.getElementById('delete-all-modal-confirm');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toast-message');
        const toastAction = document.getElementById('toast-action');

        // Initialize
        renderProjects();

        // Set initial history state
        window.history.replaceState({ view: 'projects' }, '', '');

        // Event listeners
        addProjectBtn.addEventListener('click', () => {
            editingProjectId = null;
            document.querySelector('.modal-content h2').textContent = 'New Project';
            projectModal.classList.add('active');
            projectModalInput.value = '';
            projectModalInput.focus();
        });

        modalCancel.addEventListener('click', () => {
            projectModal.classList.remove('active');
            editingProjectId = null;
        });

        modalConfirm.addEventListener('click', () => {
            if (editingProjectId) {
                updateProject();
            } else {
                createProject();
            }
        });

        projectModalInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                if (editingProjectId) {
                    updateProject();
                } else {
                    createProject();
                }
            }
        });

        backBtn.addEventListener('click', () => {
            saveCurrentProject();
            showProjectsView();
            // Go back in history if we pushed a state
            if (window.history.state && window.history.state.view === 'tasks') {
                window.history.back();
            }
        });

        // Handle Android/browser back button
        window.addEventListener('popstate', (e) => {
            if (e.state && e.state.view === 'projects') {
                saveCurrentProject();
                showProjectsView();
            } else if (!e.state) {
                // If no state, check if we're in tasks view and go back
                if (tasksView.classList.contains('active')) {
                    saveCurrentProject();
                    showProjectsView();
                }
            }
        });

        addTaskSubmit.addEventListener('click', addTask);

        clearAllBtn.addEventListener('click', () => {
            const project = projects.find(p => p.id === currentProjectId);
            if (project && project.tasks.length > 0) {
                // Check if there are any completed tasks
                const hasCompletedTasks = project.tasks.some(task => task.completed);

                if (hasCompletedTasks) {
                    // Uncheck all tasks
                    project.tasks.forEach(task => {
                        task.completed = false;
                    });
                    saveData();
                    renderTasks();
                }
            }
        });

        deleteAllBtn.addEventListener('click', () => {
            const project = projects.find(p => p.id === currentProjectId);
            if (!project || project.tasks.length === 0) {
                showToast('No tasks to delete');
                return;
            }

            deleteAllModalMessage.textContent = `Delete all ${project.tasks.length} tasks? This cannot be undone.`;
            deleteAllModal.classList.add('active');
        });

        copyAllBtn.addEventListener('click', async () => {
            const project = projects.find(p => p.id === currentProjectId);
            if (project && project.tasks.length > 0) {
                // Create a text list of all tasks
                const taskList = project.tasks.map((task, index) => {
                    const checkbox = task.completed ? '[x]' : '[ ]';
                    return `${checkbox} ${task.text}`;
                }).join('\n');

                // Use fallback method (more reliable across browsers)
                const textArea = document.createElement('textarea');
                textArea.value = taskList;
                textArea.style.position = 'fixed';
                textArea.style.top = '0';
                textArea.style.left = '0';
                textArea.style.width = '2em';
                textArea.style.height = '2em';
                textArea.style.padding = '0';
                textArea.style.border = 'none';
                textArea.style.outline = 'none';
                textArea.style.boxShadow = 'none';
                textArea.style.background = 'transparent';
                textArea.style.opacity = '0';
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();

                try {
                    const successful = document.execCommand('copy');
                    if (successful) {
                        showToast(`Copied ${project.tasks.length} tasks`);
                    } else {
                        showToast('Copy failed - please try again');
                    }
                } catch (err) {
                    console.error('Copy error:', err);
                    showToast('Copy failed - please try again');
                } finally {
                    document.body.removeChild(textArea);
                }
            } else {
                showToast('No tasks to copy');
            }
        });

        pasteAllBtn.addEventListener('click', async () => {
            if (!navigator.clipboard || !navigator.clipboard.readText) {
                showToast('Clipboard access not available');
                return;
            }

            try {
                const text = await navigator.clipboard.readText();
                if (!text || !text.trim()) {
                    showToast('Clipboard is empty');
                    return;
                }
                addTasksFromText(text);
            } catch (err) {
                console.error('Paste error:', err);
                showToast('Paste failed - please try again');
            }
        });

        addTaskInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault(); // Prevent form submission
                addTask();
            }
        });

        // Also handle mobile virtual keyboard "Go" button
        addTaskInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.keyCode === 13) {
                e.preventDefault();
                addTask();
            }
        });

        // Smart paste - detect when user pastes multiple lines and create multiple tasks
        addTaskInput.addEventListener('paste', (e) => {
            e.preventDefault();
            const pastedText = (e.clipboardData || window.clipboardData).getData('text');
            addTasksFromText(pastedText);
        });

        function addTasksFromText(text) {
            if (!text) {
                showToast('Clipboard is empty');
                return;
            }

            const lines = text
                .split('\n')
                .map(line => line.trim())
                .filter(line => line.length > 0);

            if (lines.length > 1) {
                const project = projects.find(p => p.id === currentProjectId);
                if (project) {
                    lines.forEach(line => {
                        const cleanedLine = line
                            .replace(/^[-*\u2022]\s+/, '')
                            .replace(/^\d+[\.\)]\s+/, '')
                            .replace(/^[\[\(]?\s*[xX\u2713\u2714]\s*[\]\)]?\s+/, '')
                            .trim();

                        if (cleanedLine) {
                            project.tasks.push({
                                text: cleanedLine,
                                completed: false
                            });
                        }
                    });
                    saveData();
                    renderTasks();
                    addTaskInput.value = '';
                    showToast(`Added ${lines.length} tasks`);
                }
            } else if (lines.length === 1) {
                addTaskInput.value = lines[0];
            }
        }


        projectNameInput.addEventListener('input', () => {
            const project = projects.find(p => p.id === currentProjectId);
            if (project) {
                project.name = projectNameInput.value;
                saveData();
                renderProjects();
            }
        });

        // Click outside modal to close
        projectModal.addEventListener('click', (e) => {
            if (e.target === projectModal) {
                projectModal.classList.remove('active');
                editingProjectId = null;
            }
        });

        deleteModal.addEventListener('click', (e) => {
            if (e.target === deleteModal) {
                deleteModal.classList.remove('active');
                deletingProjectId = null;
            }
        });

        deleteAllModal.addEventListener('click', (e) => {
            if (e.target === deleteAllModal) {
                deleteAllModal.classList.remove('active');
            }
        });

        deleteModalCancel.addEventListener('click', () => {
            deleteModal.classList.remove('active');
            deletingProjectId = null;
        });

        deleteAllModalCancel.addEventListener('click', () => {
            deleteAllModal.classList.remove('active');
        });

        deleteModalConfirm.addEventListener('click', () => {
            if (deletingProjectId) {
                // Store the deleted project for undo
                deletedProject = projects.find(p => p.id === deletingProjectId);

                // Filter out the project
                projects = projects.filter(function (p) {
                    return p.id !== deletingProjectId;
                });

                // Save to localStorage
                localStorage.setItem('projects', JSON.stringify(projects));

                // If viewing this project, go back
                if (currentProjectId === deletingProjectId) {
                    currentProjectId = null;
                    showProjectsView();
                }

                // Re-render the list
                renderProjects();

                // Close modal
                deleteModal.classList.remove('active');
                deletingProjectId = null;

                // Show toast with undo option
                showToast('Project "' + deletedProject.name + '" deleted');
            }
        });

        deleteAllModalConfirm.addEventListener('click', () => {
            const project = projects.find(p => p.id === currentProjectId);
            if (project) {
                project.tasks = [];
                saveData();
                renderTasks();
                showToast('All tasks deleted');
            }
            deleteAllModal.classList.remove('active');
        });

        // Functions
        function createProject() {
            const name = projectModalInput.value.trim();
            if (name) {
                const project = {
                    id: Date.now(),
                    name: name,
                    tasks: []
                };
                projects.push(project);
                saveData();
                renderProjects();
                projectModal.classList.remove('active');
            }
        }

        function updateProject() {
            const name = projectModalInput.value.trim();
            if (name && editingProjectId) {
                const project = projects.find(p => p.id === editingProjectId);
                if (project) {
                    project.name = name;
                    saveData();
                    renderProjects();
                    if (currentProjectId === editingProjectId) {
                        projectNameInput.value = name;
                    }
                }
                projectModal.classList.remove('active');
                editingProjectId = null;
            }
        }

        function editProject(projectId, event) {
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }
            editingProjectId = projectId;
            const project = projects.find(p => p.id === projectId);
            if (project) {
                document.querySelector('.modal-content h2').textContent = 'Edit Project';
                projectModalInput.value = project.name;
                projectModal.classList.add('active');
                projectModalInput.focus();
                projectModalInput.select();
            }
        }

        function deleteProject(projectId, event) {
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }
            const project = projects.find(p => p.id === projectId);
            if (project) {
                const confirmDelete = confirm(`Delete "${project.name}"?\n\nThis will permanently delete the project and all its tasks.`);
                if (confirmDelete) {
                    projects = projects.filter(p => p.id !== projectId);
                    saveData();
                    renderProjects();
                    if (currentProjectId === projectId) {
                        showProjectsView();
                    }
                }
            }
        }

        function renderProjects() {
            projectsList.innerHTML = '';
            projects.forEach(project => {
                const projectItem = document.createElement('div');
                projectItem.className = 'project-item';

                // Create content section
                const projectContent = document.createElement('div');
                projectContent.className = 'project-content';

                const projectTitle = document.createElement('div');
                projectTitle.className = 'project-title';
                projectTitle.textContent = project.name;

                projectContent.appendChild(projectTitle);

                // Create actions section
                const projectActions = document.createElement('div');
                projectActions.className = 'project-actions';

                const editBtn = document.createElement('button');
                editBtn.className = 'project-action-btn edit';
                editBtn.title = 'Edit';
                editBtn.innerHTML = '✎';

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'project-action-btn delete';
                deleteBtn.title = 'Delete';
                deleteBtn.innerHTML = '×';

                // Handle edit button click
                editBtn.onclick = function (e) {
                    e.stopPropagation();
                    e.stopImmediatePropagation();
                    e.preventDefault();

                    editingProjectId = project.id;
                    const proj = projects.find(p => p.id === project.id);
                    if (proj) {
                        document.querySelector('.modal-content h2').textContent = 'Edit Project';
                        projectModalInput.value = proj.name;
                        projectModal.classList.add('active');
                        projectModalInput.focus();
                        projectModalInput.select();
                    }
                    return false;
                };

                // Handle delete button click
                deleteBtn.onclick = function (e) {
                    e.stopPropagation();
                    e.stopImmediatePropagation();
                    e.preventDefault();

                    // Set the deleting project ID
                    deletingProjectId = project.id;

                    // Update modal message
                    deleteModalMessage.textContent = 'Are you sure you want to delete "' + project.name + '"? This will permanently delete the project and all its tasks.';

                    // Show modal
                    deleteModal.classList.add('active');

                    return false;
                };

                projectActions.appendChild(editBtn);
                projectActions.appendChild(deleteBtn);

                projectItem.appendChild(projectContent);
                projectItem.appendChild(projectActions);

                // Handle project item click to open
                projectItem.onclick = function (e) {
                    // Check if click is on a button
                    if (e.target.tagName === 'BUTTON' || e.target.closest('button')) {
                        return false;
                    }
                    openProject(project.id);
                };

                projectsList.appendChild(projectItem);
            });
        }

        function openProject(projectId) {
            currentProjectId = projectId;
            const project = projects.find(p => p.id === projectId);
            if (project) {
                projectNameInput.value = project.name;
                renderTasks();
                showTasksView();
                // Push state to history for Android back button
                window.history.pushState({ view: 'tasks', projectId: projectId }, '', '');
            }
        }

        function renderTasks() {
            const project = projects.find(p => p.id === currentProjectId);
            if (!project) return;

            tasksList.innerHTML = '';
            project.tasks.forEach((task, index) => {
                const taskItem = document.createElement('div');
                taskItem.className = 'task-item';

                // Add swipe indicators
                const swipeLeftIndicator = document.createElement('div');
                swipeLeftIndicator.className = 'swipe-indicator left';
                swipeLeftIndicator.textContent = '✓';

                const swipeRightIndicator = document.createElement('div');
                swipeRightIndicator.className = 'swipe-indicator right';
                swipeRightIndicator.textContent = '✕';

                taskItem.appendChild(swipeLeftIndicator);
                taskItem.appendChild(swipeRightIndicator);

                const checkbox = document.createElement('div');
                checkbox.className = `task-checkbox ${task.completed ? 'checked' : ''}`;
                checkbox.addEventListener('click', () => toggleTask(index));

                const taskText = document.createElement('input');
                taskText.type = 'text';
                taskText.className = `task-text ${task.completed ? 'completed' : ''}`;
                taskText.value = task.text;
                taskText.addEventListener('input', (e) => {
                    task.text = e.target.value;
                    saveData();
                });

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'delete-task-btn';
                deleteBtn.innerHTML = '×';
                deleteBtn.addEventListener('click', () => deleteTask(index));

                taskItem.appendChild(checkbox);
                taskItem.appendChild(taskText);
                taskItem.appendChild(deleteBtn);

                // Long-press drag to reorder
                let pressStartX = 0;
                let pressStartY = 0;

                const clearLongPress = () => {
                    if (dragState.longPressTimer) {
                        clearTimeout(dragState.longPressTimer);
                        dragState.longPressTimer = null;
                    }
                    dragState.pending = false;
                };

                const activateDrag = (event) => {
                    dragState.active = true;
                    dragState.pending = false;
                    dragState.startIndex = index;
                    dragState.currentIndex = index;
                    dragState.dragEl = taskItem;
                    dragState.startY = event.clientY;
                    dragState.pointerId = event.pointerId;

                    taskItem.classList.add('dragging');
                    tasksList.classList.add('dragging');
                    taskItem.style.pointerEvents = 'none';

                    const placeholder = document.createElement('div');
                    placeholder.className = 'task-item drag-placeholder';
                    placeholder.style.height = `${taskItem.offsetHeight}px`;
                    dragState.placeholder = placeholder;
                    taskItem.insertAdjacentElement('afterend', placeholder);

                    taskItem.setPointerCapture(event.pointerId);
                    document.addEventListener('pointermove', handleDragMove);
                    document.addEventListener('pointerup', handleDragEnd);
                    document.addEventListener('pointercancel', handleDragEnd);
                };

                const handleDragMove = (event) => {
                    if (!dragState.active || dragState.dragEl !== taskItem || event.pointerId !== dragState.pointerId) {
                        return;
                    }

                    event.preventDefault();
                    dragState.lastX = event.clientX;
                    dragState.lastY = event.clientY;
                    if (dragState.rafId) return;

                    dragState.rafId = requestAnimationFrame(() => {
                        dragState.rafId = null;
                        const diffY = dragState.lastY - dragState.startY;
                        taskItem.style.transform = `translateY(${diffY}px) scale(1.02)`;

                        let targetItem = null;
                        const el = document.elementFromPoint(dragState.lastX, dragState.lastY);
                        if (el) {
                            const candidate = el.closest('.task-item');
                            if (candidate && candidate !== taskItem && !candidate.classList.contains('drag-placeholder')) {
                                targetItem = candidate;
                            }
                        }

                        if (!targetItem) {
                            const items = Array.from(tasksList.querySelectorAll('.task-item:not(.dragging):not(.drag-placeholder)'));
                            if (items.length === 0) return;
                            let closest = null;
                            let closestDistance = Infinity;
                            items.forEach(item => {
                                const rect = item.getBoundingClientRect();
                                const midY = rect.top + rect.height / 2;
                                const distance = Math.abs(dragState.lastY - midY);
                                if (distance < closestDistance) {
                                    closestDistance = distance;
                                    closest = item;
                                }
                            });
                            targetItem = closest;
                        }

                        if (!targetItem) return;

                        const rect = targetItem.getBoundingClientRect();
                        const before = dragState.lastY < rect.top + rect.height / 2;
                        const placeholder = dragState.placeholder;
                        if (!placeholder) return;

                        const prev = placeholder.previousElementSibling;
                        const next = placeholder.nextElementSibling;
                        if (before && targetItem === next) {
                            return;
                        }
                        if (!before && targetItem === prev) {
                            return;
                        }

                        if (before) {
                            tasksList.insertBefore(placeholder, targetItem);
                        } else {
                            tasksList.insertBefore(placeholder, targetItem.nextSibling);
                        }
                    });
                };

                const handleDragEnd = (event) => {
                    if (!dragState.active || dragState.dragEl !== taskItem || event.pointerId !== dragState.pointerId) {
                        clearLongPress();
                        return;
                    }

                    taskItem.releasePointerCapture(event.pointerId);
                    document.removeEventListener('pointermove', handleDragMove);
                    document.removeEventListener('pointerup', handleDragEnd);
                    document.removeEventListener('pointercancel', handleDragEnd);
                    if (dragState.rafId) {
                        cancelAnimationFrame(dragState.rafId);
                        dragState.rafId = null;
                    }

                    const children = Array.from(tasksList.children);
                    const placeholderIndex = children.indexOf(dragState.placeholder);
                    const dragIndex = children.indexOf(dragState.dragEl);
                    let finalIndex = placeholderIndex;
                    if (placeholderIndex > dragIndex) {
                        finalIndex -= 1;
                    }

                    taskItem.style.transform = '';
                    taskItem.style.pointerEvents = '';
                    taskItem.classList.remove('dragging');
                    tasksList.classList.remove('dragging');

                    if (dragState.placeholder) {
                        dragState.placeholder.remove();
                    }

                    dragState.active = false;
                    dragState.dragEl = null;
                    dragState.placeholder = null;
                    dragState.pointerId = null;
                    dragState.lastX = 0;
                    dragState.lastY = 0;
                    clearLongPress();

                    if (finalIndex !== null && finalIndex >= 0 && finalIndex !== dragState.startIndex) {
                        moveTask(project, dragState.startIndex, finalIndex);
                    } else {
                        renderTasks();
                    }
                };

                taskItem.addEventListener('pointerdown', (event) => {
                    if (event.button !== 0) return;
                    if (event.target.closest('input, button')) return;
                    if (dragState.active) return;

                    pressStartX = event.clientX;
                    pressStartY = event.clientY;
                    dragState.pending = true;

                    clearLongPress();
                    dragState.longPressTimer = setTimeout(() => activateDrag(event), 300);
                });

                taskItem.addEventListener('pointermove', (event) => {
                    if (!dragState.pending || dragState.active) return;
                    const diffX = Math.abs(event.clientX - pressStartX);
                    const diffY = Math.abs(event.clientY - pressStartY);
                    if (diffX > 10 || diffY > 10) {
                        clearLongPress();
                    }
                });

                taskItem.addEventListener('pointerup', () => {
                    if (!dragState.active) {
                        clearLongPress();
                    }
                });

                taskItem.addEventListener('pointercancel', () => {
                    if (!dragState.active) {
                        clearLongPress();
                    }
                });

                // Add swipe gesture support
                let startX = 0;
                let startY = 0;
                let currentX = 0;
                let currentY = 0;
                let isSwiping = false;
                let isVerticalScroll = false;

                taskItem.addEventListener('touchstart', (e) => {
                    if (dragState.active || dragState.pending) return;
                    startX = e.touches[0].clientX;
                    startY = e.touches[0].clientY;
                    isSwiping = false;
                    isVerticalScroll = false;
                });

                taskItem.addEventListener('touchmove', (e) => {
                    if (dragState.active || dragState.pending) return;
                    currentX = e.touches[0].clientX;
                    currentY = e.touches[0].clientY;
                    const diffX = currentX - startX;
                    const diffY = currentY - startY;

                    // Determine if it's a vertical scroll or horizontal swipe
                    if (!isSwiping && !isVerticalScroll) {
                        if (Math.abs(diffY) > Math.abs(diffX)) {
                            // More vertical movement - allow scrolling
                            isVerticalScroll = true;
                            return;
                        } else if (Math.abs(diffX) > 15) {
                            // More horizontal movement - start swiping
                            isSwiping = true;
                            taskItem.classList.add('swiping');
                        }
                    }

                    if (!isSwiping) return;

                    // Prevent scrolling when swiping
                    e.preventDefault();
                    taskItem.style.transform = `translateX(${diffX}px)`;

                    // Show visual feedback (increased threshold to 80px)
                    if (diffX > 80) {
                        taskItem.classList.add('swipe-right');
                        taskItem.classList.remove('swipe-left');
                    } else if (diffX < -80) {
                        taskItem.classList.add('swipe-left');
                        taskItem.classList.remove('swipe-right');
                    } else {
                        taskItem.classList.remove('swipe-left', 'swipe-right');
                    }
                });

                taskItem.addEventListener('touchend', () => {
                    if (dragState.active || dragState.pending) return;
                    if (isVerticalScroll) {
                        isVerticalScroll = false;
                        return;
                    }

                    if (!isSwiping) return;

                    const diffX = currentX - startX;

                    // Increased thresholds: Swipe right to complete (150px), swipe left to delete (150px)
                    if (diffX > 150) {
                        toggleTask(index);
                    } else if (diffX < -150) {
                        deleteTask(index);
                    }

                    // Reset
                    taskItem.style.transform = '';
                    taskItem.classList.remove('swiping', 'swipe-left', 'swipe-right');
                    isSwiping = false;
                    isVerticalScroll = false;
                    startX = 0;
                    startY = 0;
                    currentX = 0;
                    currentY = 0;
                });

                // Cancel swipe if touch is cancelled
                taskItem.addEventListener('touchcancel', () => {
                    if (dragState.active || dragState.pending) return;
                    taskItem.style.transform = '';
                    taskItem.classList.remove('swiping', 'swipe-left', 'swipe-right');
                    isSwiping = false;
                    isVerticalScroll = false;
                    startX = 0;
                    startY = 0;
                    currentX = 0;
                    currentY = 0;
                });

                tasksList.appendChild(taskItem);
            });
        }

        function moveTask(project, fromIndex, toIndex) {
            if (!project || fromIndex === toIndex) return;
            const task = project.tasks.splice(fromIndex, 1)[0];
            project.tasks.splice(toIndex, 0, task);
            saveData();
            renderTasks();
        }

        function addTask() {
            const text = addTaskInput.value.trim();
            if (text) {
                const project = projects.find(p => p.id === currentProjectId);
                if (project) {
                    project.tasks.push({
                        text: text,
                        completed: false
                    });
                    saveData();
                    renderTasks();
                    addTaskInput.value = '';
                }
            }
        }

        function toggleTask(index) {
            const project = projects.find(p => p.id === currentProjectId);
            if (project) {
                project.tasks[index].completed = !project.tasks[index].completed;
                saveData();
                renderTasks();
            }
        }

        function deleteTask(index) {
            const project = projects.find(p => p.id === currentProjectId);
            if (project) {
                project.tasks.splice(index, 1);
                saveData();
                renderTasks();
            }
        }

        function saveCurrentProject() {
            const project = projects.find(p => p.id === currentProjectId);
            if (project) {
                project.name = projectNameInput.value;
                saveData();
            }
        }

        function showProjectsView() {
            projectsView.classList.remove('hidden');
            tasksView.classList.remove('active');
            currentProjectId = null;
            // Push state for projects view
            if (window.history.state && window.history.state.view === 'tasks') {
                // Don't push if we're already going back
                return;
            }
            window.history.pushState({ view: 'projects' }, '', '');
        }

        function showTasksView() {
            projectsView.classList.add('hidden');
            tasksView.classList.add('active');
            // Don't auto-focus to prevent keyboard popup on mobile
        }

        function saveData() {
            localStorage.setItem('projects', JSON.stringify(projects));
        }

        // Toast notification functions
        function showToast(message) {
            toastMessage.textContent = message;
            toast.classList.add('show');

            // Clear any existing timeout
            if (toastTimeout) {
                clearTimeout(toastTimeout);
            }

            // Auto-hide after 5 seconds
            toastTimeout = setTimeout(() => {
                hideToast();
            }, 5000);
        }

        function hideToast() {
            toast.classList.remove('show');
            if (toastTimeout) {
                clearTimeout(toastTimeout);
                toastTimeout = null;
            }
            // Clear deleted project after animation completes
            setTimeout(() => {
                deletedProject = null;
            }, 300);
        }

        // Undo delete handler
        toastAction.addEventListener('click', () => {
            if (deletedProject) {
                // Restore the project
                projects.push(deletedProject);
                saveData();
                renderProjects();

                // Hide toast immediately
                hideToast();
            }
        });
    </script>
    <script>
        if ("serviceWorker" in navigator) {
            let refreshing = false;

            navigator.serviceWorker.register("./sw.js").then(registration => {
                registration.addEventListener("updatefound", () => {
                    const newWorker = registration.installing;
                    if (!newWorker) return;

                    newWorker.addEventListener("statechange", () => {
                        if (newWorker.state === "activated" && navigator.serviceWorker.controller) {
                            if (refreshing) return;
                            refreshing = true;
                            window.location.reload();
                        }
                    });
                });
            });

            navigator.serviceWorker.addEventListener("controllerchange", () => {
                if (refreshing) return;
                refreshing = true;
                window.location.reload();
            });
        }
    </script>
